name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente de Prisma
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Validación de tipos
        run: pnpm typecheck

      - name: Pruebas
        run: pnpm test:run

      - name: Build
        run: pnpm build
        env:
          # Valores de CI: no apuntan a servicios reales.
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ci?sslmode=disable"
          BETTER_AUTH_SECRET: "ci-secret-cadena-suficientemente-larga-000000000000"
          BETTER_AUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
